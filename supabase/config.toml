
[functions.ppl_metrics]
enabled = true
verify_jwt = true
import_map = "./functions/ppl_metrics/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/ppl_metrics/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/ppl_metrics/*.html" ]

[functions.bill_update]
enabled = true
verify_jwt = true
entrypoint = "./functions/bill_update/index.ts"

[functions.bill_search]
enabled = true
verify_jwt = true
entrypoint = "./functions/bill_search/index.ts"

[functions.apple_webhook]
enabled = true
# Apple's App Store Server Notifications POST here with no Supabase auth header —
# trust comes from verifying the JWS signature/cert chain in-function instead.
verify_jwt = false
entrypoint = "./functions/apple_webhook/index.ts"
